server:
  port: 8081

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5433/catalog-db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

logging:
  level:
    root: INFO
    com.example.catalog: DEBUG
    org.springframework.web.reactive.function.client: TRACE

app:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  assets:
    storage-type: local
    local:
      base-dir: ${ASSETS_BASE_DIR:${user.home}/.micro-reco/assets}
      public-url: ${ASSETS_PUBLIC_URL:http://localhost:8081/assets}

security:
  jwt:
    secret: ${JWT_SECRET:change-me-local-dev-secret-change-me-local-dev-secret}
    issuer: reco-platform
    expiration-seconds: 43200

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

clients:
  event:
    base-url: http://localhost:8082
    source: CATALOG

tmdb:
  api-key: ${TMDB_API_KEY:change-me}
  base-url: https://api.themoviedb.org/3
  image-base-url: https://image.tmdb.org/t/p
  poster-size: w500
  backdrop-size: w780
  profile-size: w185
  proxy:
    host: ${TMDB_PROXY_HOST:127.0.0.1}
    port: ${TMDB_PROXY_PORT:10809}
    username: ${TMDB_PROXY_USERNAME:}
    password: ${TMDB_PROXY_PASSWORD:}
