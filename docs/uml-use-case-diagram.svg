<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200">
  <defs>
    <style>
      .title { font-family: "Times New Roman", serif; font-size: 32px; fill: #111; }
      .boundary-title { font-family: "Times New Roman", serif; font-size: 24px; fill: #111; }
      .label { font-family: "Times New Roman", serif; font-size: 24px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .label-small { font-family: "Times New Roman", serif; font-size: 21px; fill: #111; text-anchor: middle; dominant-baseline: middle; }
      .actor-label { font-family: "Times New Roman", serif; font-size: 24px; fill: #111; text-anchor: middle; }
      .boundary { fill: #fff; stroke: #cfcfcf; stroke-width: 2; }
      .usecase { fill: #fff; stroke: #9d9d9d; stroke-width: 2.2; }
      .actor { fill: none; stroke: #111; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .guest-line { fill: none; stroke: #d9535f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .user-line { fill: none; stroke: #28a86b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .admin-line { fill: none; stroke: #2587c9; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .external-line { fill: none; stroke: #d8891f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .note { font-family: "Times New Roman", serif; font-size: 18px; fill: #555; }
    </style>
  </defs>

  <text x="900" y="36" class="title" text-anchor="middle">UML-диаграмма вариантов использования платформы рекомендаций фильмов</text>

  <rect x="285" y="62" width="1230" height="1038" class="boundary"/>
  <text x="900" y="94" class="boundary-title" text-anchor="middle">Платформа рекомендаций фильмов</text>

  <!-- Actors -->
  <g transform="translate(120 155)">
    <circle cx="0" cy="-38" r="20" class="actor"/>
    <line x1="0" y1="-18" x2="0" y2="42" class="actor"/>
    <line x1="-36" y1="7" x2="36" y2="7" class="actor"/>
    <line x1="0" y1="42" x2="-34" y2="92" class="actor"/>
    <line x1="0" y1="42" x2="34" y2="92" class="actor"/>
    <text x="0" y="126" class="actor-label">Гость</text>
  </g>

  <g transform="translate(120 560)">
    <circle cx="0" cy="-38" r="20" class="actor"/>
    <line x1="0" y1="-18" x2="0" y2="42" class="actor"/>
    <line x1="-36" y1="7" x2="36" y2="7" class="actor"/>
    <line x1="0" y1="42" x2="-34" y2="92" class="actor"/>
    <line x1="0" y1="42" x2="34" y2="92" class="actor"/>
    <text x="0" y="126" class="actor-label">Пользователь</text>
  </g>

  <g transform="translate(1680 545)">
    <circle cx="0" cy="-38" r="20" class="actor"/>
    <line x1="0" y1="-18" x2="0" y2="42" class="actor"/>
    <line x1="-36" y1="7" x2="36" y2="7" class="actor"/>
    <line x1="0" y1="42" x2="-34" y2="92" class="actor"/>
    <line x1="0" y1="42" x2="34" y2="92" class="actor"/>
    <text x="0" y="126" class="actor-label">Администратор</text>
  </g>

  <g transform="translate(1680 990)">
    <circle cx="0" cy="-38" r="20" class="actor"/>
    <line x1="0" y1="-18" x2="0" y2="42" class="actor"/>
    <line x1="-36" y1="7" x2="36" y2="7" class="actor"/>
    <line x1="0" y1="42" x2="-34" y2="92" class="actor"/>
    <line x1="0" y1="42" x2="34" y2="92" class="actor"/>
    <text x="0" y="126" class="actor-label">TMDb API</text>
  </g>

  <!-- Use cases: user side -->
  <ellipse cx="710" cy="135" rx="220" ry="46" class="usecase"/>
  <text x="710" y="128" class="label">
    <tspan x="710" dy="0">Зарегистрироваться</tspan>
    <tspan x="710" dy="27">или войти в систему</tspan>
  </text>

  <ellipse cx="710" cy="250" rx="220" ry="46" class="usecase"/>
  <text x="710" y="243" class="label">
    <tspan x="710" dy="0">Просмотреть каталог</tspan>
    <tspan x="710" dy="27">и карточки фильмов</tspan>
  </text>

  <ellipse cx="710" cy="365" rx="220" ry="46" class="usecase"/>
  <text x="710" y="358" class="label">
    <tspan x="710" dy="0">Найти и отфильтровать</tspan>
    <tspan x="710" dy="27">фильмы</tspan>
  </text>

  <ellipse cx="710" cy="480" rx="220" ry="46" class="usecase"/>
  <text x="710" y="473" class="label">
    <tspan x="710" dy="0">Оценить фильм</tspan>
    <tspan x="710" dy="27">и оставить отзыв</tspan>
  </text>

  <ellipse cx="710" cy="595" rx="220" ry="50" class="usecase"/>
  <text x="710" y="580" class="label-small">
    <tspan x="710" dy="0">Управлять коллекциями</tspan>
    <tspan x="710" dy="25">избранное, закладки,</tspan>
    <tspan x="710" dy="25">просмотрено</tspan>
  </text>

  <ellipse cx="710" cy="715" rx="220" ry="50" class="usecase"/>
  <text x="710" y="700" class="label-small">
    <tspan x="710" dy="0">Настроить профиль,</tspan>
    <tspan x="710" dy="25">приватность</tspan>
    <tspan x="710" dy="25">и подписки</tspan>
  </text>

  <ellipse cx="710" cy="835" rx="220" ry="50" class="usecase"/>
  <text x="710" y="820" class="label-small">
    <tspan x="710" dy="0">Получить рекомендации</tspan>
    <tspan x="710" dy="25">персональные, популярные,</tspan>
    <tspan x="710" dy="25">похожие фильмы</tspan>
  </text>

  <ellipse cx="710" cy="955" rx="220" ry="50" class="usecase"/>
  <text x="710" y="940" class="label-small">
    <tspan x="710" dy="0">Зафиксировать действия</tspan>
    <tspan x="710" dy="25">просмотры, оценки,</tspan>
    <tspan x="710" dy="25">избранное и закладки</tspan>
  </text>

  <!-- Use cases: admin side -->
  <ellipse cx="1165" cy="190" rx="230" ry="46" class="usecase"/>
  <text x="1165" y="183" class="label">
    <tspan x="1165" dy="0">Управлять пользователями</tspan>
    <tspan x="1165" dy="27">и доступом</tspan>
  </text>

  <ellipse cx="1165" cy="305" rx="230" ry="46" class="usecase"/>
  <text x="1165" y="298" class="label">
    <tspan x="1165" dy="0">Модерировать отзывы</tspan>
    <tspan x="1165" dy="27">и жалобы</tspan>
  </text>

  <ellipse cx="1165" cy="420" rx="230" ry="46" class="usecase"/>
  <text x="1165" y="413" class="label">
    <tspan x="1165" dy="0">Управлять каталогом</tspan>
    <tspan x="1165" dy="27">фильмов и медиа</tspan>
  </text>

  <ellipse cx="1165" cy="535" rx="230" ry="46" class="usecase"/>
  <text x="1165" y="528" class="label">
    <tspan x="1165" dy="0">Импортировать данные</tspan>
    <tspan x="1165" dy="27">фильмов из TMDb</tspan>
  </text>

  <ellipse cx="1165" cy="650" rx="230" ry="46" class="usecase"/>
  <text x="1165" y="643" class="label">
    <tspan x="1165" dy="0">Настраивать стратегии</tspan>
    <tspan x="1165" dy="27">рекомендаций</tspan>
  </text>

  <ellipse cx="1165" cy="765" rx="230" ry="46" class="usecase"/>
  <text x="1165" y="758" class="label">
    <tspan x="1165" dy="0">Запускать пересчет</tspan>
    <tspan x="1165" dy="27">рекомендаций</tspan>
  </text>

  <ellipse cx="1165" cy="880" rx="230" ry="46" class="usecase"/>
  <text x="1165" y="873" class="label">
    <tspan x="1165" dy="0">Просматривать аналитику</tspan>
    <tspan x="1165" dy="27">и отчеты</tspan>
  </text>

  <!-- Associations -->
  <path d="M 145 155 H 245 V 135 H 490" class="guest-line"/>

  <path d="M 145 560 H 240" class="user-line"/>
  <path d="M 240 250 V 955" class="user-line"/>
  <path d="M 240 250 H 490" class="user-line"/>
  <path d="M 240 365 H 490" class="user-line"/>
  <path d="M 240 480 H 490" class="user-line"/>
  <path d="M 240 595 H 490" class="user-line"/>
  <path d="M 240 715 H 490" class="user-line"/>
  <path d="M 240 835 H 490" class="user-line"/>
  <path d="M 240 955 H 490" class="user-line"/>

  <path d="M 1655 545 H 1570" class="admin-line"/>
  <path d="M 1570 190 V 880" class="admin-line"/>
  <path d="M 1570 190 H 1395" class="admin-line"/>
  <path d="M 1570 305 H 1395" class="admin-line"/>
  <path d="M 1570 420 H 1395" class="admin-line"/>
  <path d="M 1570 535 H 1395" class="admin-line"/>
  <path d="M 1570 650 H 1395" class="admin-line"/>
  <path d="M 1570 765 H 1395" class="admin-line"/>
  <path d="M 1570 880 H 1395" class="admin-line"/>

  <path d="M 1655 990 H 1535 V 535 H 1395" class="external-line"/>

  <text x="372" y="1080" class="note">Цвет связей: гость - регистрация/вход; пользователь - работа с каталогом и рекомендациями; администратор - управление и аналитика; TMDb API - внешний источник данных.</text>
</svg>
