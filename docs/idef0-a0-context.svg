<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="820" viewBox="0 0 1500 820">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#111"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .arrow { fill: none; stroke: #111; stroke-width: 2; marker-end: url(#arrow); }
      .line { fill: none; stroke: #111; stroke-width: 2; }
      .label { font-family: "Times New Roman", serif; font-size: 22px; fill: #000; }
      .small { font-family: "Times New Roman", serif; font-size: 20px; fill: #000; }
      .block { font-family: "Times New Roman", serif; font-size: 23px; fill: #000; }
    </style>
  </defs>

  <rect width="1500" height="820" fill="#fff"/>

  <!-- Function block -->
  <rect class="box" x="560" y="330" width="390" height="125"/>
  <text class="block" text-anchor="middle">
    <tspan x="755" y="368">Обеспечить работу</tspan>
    <tspan x="755" y="397">платформы рекомендаций</tspan>
    <tspan x="755" y="426">фильмов</tspan>
  </text>

  <!-- Inputs -->
  <text class="label" text-anchor="end">
    <tspan x="240" y="300">Запросы и действия</tspan>
    <tspan x="240" y="328">пользователя</tspan>
  </text>
  <path class="line" d="M 250 315 L 420 315 L 420 360 L 560 360"/>
  <path class="arrow" d="M 420 360 L 560 360"/>

  <text class="label" text-anchor="end">
    <tspan x="240" y="392">Команды</tspan>
    <tspan x="240" y="420">администратора</tspan>
  </text>
  <path class="arrow" d="M 250 405 L 560 405"/>

  <text class="label" text-anchor="end">
    <tspan x="240" y="490">Данные фильмов</tspan>
    <tspan x="240" y="518">и TMDb</tspan>
  </text>
  <path class="line" d="M 250 505 L 430 505 L 430 440 L 560 440"/>
  <path class="arrow" d="M 430 440 L 560 440"/>

  <!-- Controls -->
  <text class="label" text-anchor="middle">
    <tspan x="430" y="82">Политики безопасности</tspan>
    <tspan x="430" y="110">и доступа</tspan>
  </text>
  <path class="line" d="M 430 125 L 430 210 L 620 210 L 620 330"/>
  <path class="arrow" d="M 620 210 L 620 330"/>

  <text class="label" text-anchor="middle">
    <tspan x="650" y="52">Правила фильтрации</tspan>
    <tspan x="650" y="80">и модерации</tspan>
  </text>
  <path class="line" d="M 650 95 L 650 235 L 700 235 L 700 330"/>
  <path class="arrow" d="M 700 235 L 700 330"/>

  <text class="label" text-anchor="middle">
    <tspan x="860" y="82">Конфигурация</tspan>
    <tspan x="860" y="110">рекомендаций</tspan>
  </text>
  <path class="line" d="M 860 125 L 860 235 L 810 235 L 810 330"/>
  <path class="arrow" d="M 810 235 L 810 330"/>

  <text class="label" text-anchor="middle">
    <tspan x="1095" y="52">Параметры аналитики</tspan>
    <tspan x="1095" y="80">и качества</tspan>
  </text>
  <path class="line" d="M 1095 95 L 1095 210 L 900 210 L 900 330"/>
  <path class="arrow" d="M 900 210 L 900 330"/>

  <!-- Outputs -->
  <text class="label">
    <tspan x="1245" y="282">Результаты авторизации</tspan>
    <tspan x="1245" y="310">и профиль пользователя</tspan>
  </text>
  <path class="line" d="M 950 360 L 1080 360 L 1080 295 L 1230 295"/>
  <path class="arrow" d="M 1080 295 L 1230 295"/>

  <text class="label">
    <tspan x="1245" y="365">Каталог и карточки</tspan>
    <tspan x="1245" y="393">фильмов</tspan>
  </text>
  <path class="arrow" d="M 950 385 L 1230 385"/>

  <text class="label">
    <tspan x="1245" y="448">Рекомендации</tspan>
    <tspan x="1245" y="476">фильмов</tspan>
  </text>
  <path class="line" d="M 950 420 L 1080 420 L 1080 460 L 1230 460"/>
  <path class="arrow" d="M 1080 460 L 1230 460"/>

  <text class="label">
    <tspan x="1245" y="532">Административная</tspan>
    <tspan x="1245" y="560">аналитика и отчёты</tspan>
  </text>
  <path class="line" d="M 950 445 L 1070 445 L 1070 545 L 1230 545"/>
  <path class="arrow" d="M 1070 545 L 1230 545"/>

  <!-- Mechanisms -->
  <text class="small" text-anchor="middle">
    <tspan x="360" y="725">Web-приложение</tspan>
    <tspan x="360" y="750">React</tspan>
  </text>
  <path class="line" d="M 360 690 L 360 535 L 610 535 L 610 455"/>
  <path class="arrow" d="M 610 535 L 610 455"/>

  <text class="small" text-anchor="middle">
    <tspan x="565" y="725">catalog-service</tspan>
  </text>
  <path class="line" d="M 565 700 L 565 560 L 690 560 L 690 455"/>
  <path class="arrow" d="M 690 560 L 690 455"/>

  <text class="small" text-anchor="middle">
    <tspan x="755" y="725">event-service</tspan>
  </text>
  <path class="arrow" d="M 755 700 L 755 455"/>

  <text class="small" text-anchor="middle">
    <tspan x="955" y="725">recommender-service</tspan>
  </text>
  <path class="line" d="M 955 700 L 955 560 L 820 560 L 820 455"/>
  <path class="arrow" d="M 820 560 L 820 455"/>

  <text class="small" text-anchor="middle">
    <tspan x="1190" y="700">PostgreSQL</tspan>
    <tspan x="1190" y="725">catalog-db, event-db,</tspan>
    <tspan x="1190" y="750">recommender-db</tspan>
  </text>
  <path class="line" d="M 1190 675 L 1190 535 L 910 535 L 910 455"/>
  <path class="arrow" d="M 910 535 L 910 455"/>
</svg>
